services:
  - type: web
    name: sportcenter-fe
    runtime: static
    repo: https://github.com/HikariHino/SportCenterFE
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE
        value: https://sportscenterbe-2.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
