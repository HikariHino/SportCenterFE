services:
  - type: web
    name: sportcenter-fe
    runtime: static
    repo: https://github.com/HikariHino/SportCenterFE
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE
        value: https://sportscenterbe-2.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        value: 1077200298696-38gkrj4g532iflase9la3crc3t6j4mla.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
