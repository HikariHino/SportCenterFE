<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply saved appearance settings before the first paint.
      (() => {
        let saved
        try { saved = localStorage.getItem('sportcenter-theme') } catch {}
        const theme = saved === 'light' || saved === 'dark'
          ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        let fontSize
        try { fontSize = localStorage.getItem('sportcenter-font-size') } catch {}
        document.documentElement.dataset.fontSize = ['small', 'medium', 'large'].includes(fontSize) ? fontSize : 'large'
      })()
    </script>
    <title>SportCenter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
